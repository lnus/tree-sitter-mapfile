[package]
name = "tree-sitter-mapfile"
description = "MapServer Mapfile grammar for tree-sitter"
version = "0.2.1"
authors = ["Linus Wæhler <17277861+lnus@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mapfile"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/lnus/tree-sitter-mapfile"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
